<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>הגלריה | ניהול הזמנות</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ===== סרגל עליון ===== -->
<header class="topbar">
  <div class="brand">
    <span class="logo">◈</span>
    <div class="brand-text">
      <strong>הגלריה</strong>
      <span>ניהול הזמנות</span>
    </div>
  </div>
  <div class="topbar-actions">
    <span class="offline-pill" title="נשמר מקומית על הטאבלט">● עובד גם בלי רשת</span>
  </div>
</header>

<main id="app">

  <!-- ===== מסך 1: רשימת הזמנות ===== -->
  <section id="view-list" class="view">
    <div class="list-head">
      <h1>ההזמנות שלי</h1>
      <button class="btn btn-primary btn-new" data-action="new-order">+ הזמנה חדשה</button>
    </div>

    <div class="list-tools">
      <input type="search" id="search-input" class="search" placeholder="חיפוש לפי שם לקוח או תיאור..." autocomplete="off">
      <div class="filter-chips" id="status-filter">
        <button class="chip is-active" data-status="all">הכל</button>
        <button class="chip" data-status="חדש">חדש</button>
        <button class="chip" data-status="בעבודה">בעבודה</button>
        <button class="chip" data-status="מוכן">מוכן</button>
        <button class="chip" data-status="נמסר">נמסר</button>
      </div>
    </div>

    <div id="orders-container" class="orders-grid"></div>
    <p id="empty-state" class="empty-state" hidden>לא נמצאו הזמנות תואמות.</p>
  </section>

  <!-- ===== מסך 2: טופס הזמנה חדשה ===== -->
  <section id="view-form" class="view" hidden>
    <div class="form-head">
      <button class="btn btn-ghost" data-action="back-to-list">→ חזרה</button>
      <h1 id="form-title">הזמנה חדשה</h1>
    </div>

    <form id="order-form" class="order-form" novalidate>
      <input type="hidden" id="f-id">

      <div class="form-grid">
        <div class="field">
          <label for="f-customer">שם לקוח</label>
          <input type="text" id="f-customer" required>
        </div>
        <div class="field">
          <label for="f-phone">טלפון</label>
          <input type="tel" id="f-phone" inputmode="tel" placeholder="05X-XXXXXXX">
        </div>
        <div class="field">
          <label for="f-date">תאריך הזמנה</label>
          <input type="date" id="f-date">
        </div>
        <div class="field field-wide">
          <label for="f-desc">תיאור התמונה</label>
          <input type="text" id="f-desc" placeholder="מה ממסגרים">
        </div>
        <div class="field field-wide">
          <label for="f-frame">סוג / תיאור מסגרת</label>
          <input type="text" id="f-frame" placeholder="לדוגמה: פרופיל עץ אלון, זהב עתיק">
        </div>
        <div class="field">
          <label for="f-width">רוחב (ס"מ)</label>
          <input type="number" id="f-width" inputmode="decimal" min="0" step="0.5">
        </div>
        <div class="field">
          <label for="f-height">גובה (ס"מ)</label>
          <input type="number" id="f-height" inputmode="decimal" min="0" step="0.5">
        </div>

        <div class="field field-wide">
          <span class="field-label">תוספות</span>
          <div class="checks">
            <label class="check"><input type="checkbox" id="f-glass"><span>זכוכית</span></label>
            <label class="check"><input type="checkbox" id="f-backing"><span>גב</span></label>
            <label class="check"><input type="checkbox" id="f-passepartout"><span>פספרטו</span></label>
          </div>
        </div>

        <div class="field">
          <label for="f-price">מחיר כולל (₪)</label>
          <input type="number" id="f-price" inputmode="decimal" min="0" step="1" value="0">
        </div>
        <div class="field">
          <label for="f-deposit">מקדמה ששולמה (₪)</label>
          <input type="number" id="f-deposit" inputmode="decimal" min="0" step="1" value="0">
        </div>
        <div class="field">
          <span class="field-label">יתרה לתשלום</span>
          <output id="f-balance" class="balance-out">0 ₪</output>
        </div>

        <div class="field field-wide">
          <label for="f-notes">הערות</label>
          <textarea id="f-notes" rows="2"></textarea>
        </div>

        <div class="field field-wide">
          <span class="field-label">סטטוס</span>
          <div class="status-picker" id="f-status-picker">
            <button type="button" class="status-opt is-active" data-status="חדש">חדש</button>
            <button type="button" class="status-opt" data-status="בעבודה">בעבודה</button>
            <button type="button" class="status-opt" data-status="מוכן">מוכן</button>
            <button type="button" class="status-opt" data-status="נמסר">נמסר</button>
          </div>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn btn-ghost" data-action="back-to-list">ביטול</button>
        <button type="submit" class="btn btn-primary">שמירה</button>
      </div>
    </form>
  </section>

  <!-- ===== מסך 3: תצוגת הזמנה בודדת ===== -->
  <section id="view-detail" class="view" hidden>
    <div class="form-head">
      <button class="btn btn-ghost" data-action="back-to-list">→ חזרה</button>
      <h1 id="detail-title">הזמנה</h1>
    </div>
    <div id="detail-body" class="detail-body"></div>
  </section>

</main>

<div id="toast" class="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
