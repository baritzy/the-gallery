<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0073EA">
<title>הגלריה · ניהול חנות מסגרות</title>

<!-- פונט: Rubik כ-workhorse (Monday-real), עם display=swap ו-fallback ל-system-ui (עובד גם ב-file://) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/tokens.css?v=9">
<link rel="stylesheet" href="css/app.css?v=9">
</head>
<body>

<div class="app">
  <!-- nav rail (landscape) - נבנה ע"י app.js -->
  <aside class="rail" id="rail"></aside>

  <!-- אזור התוכן: שלושה מודולים -->
  <main class="main">
    <section class="view" data-view="orders" role="tabpanel" aria-label="הזמנות"></section>
    <section class="view" data-view="inventory" role="tabpanel" aria-label="מלאי"></section>
    <section class="view" data-view="customers" role="tabpanel" aria-label="לקוחות"></section>
    <section class="view" data-view="reminders" role="tabpanel" aria-label="תזכורות"></section>
    <section class="view" data-view="finance" role="tabpanel" aria-label="כספים"></section>
    <section class="view" data-view="insights" role="tabpanel" aria-label="תובנות"></section>
  </main>
</div>

<!-- bottom tab bar (portrait) - נבנה ע"י app.js -->
<nav class="bottombar" id="bottombar" aria-label="ניווט תחתון"></nav>

<!-- data.js (repository) -> app.js (util/icons/router) -> feature modules. -->
<!-- app.js מגדיר את Gallery.util ו-Gallery.icons שהמודולים תלויים בהם, לכן הוא נטען לפניהם. -->
<!-- ה-init רץ ב-DOMContentLoaded, אחרי שכל המודולים כבר נרשמו. -->
<script src="js/data.js?v=9"></script>
<script src="js/app.js?v=9"></script>
<script src="js/orders.js?v=9"></script>
<script src="js/inventory.js?v=9"></script>
<script src="js/customers.js?v=9"></script>
<script src="js/reminders.js?v=9"></script>
<script src="js/finance.js?v=9"></script>
<script src="js/insights.js?v=9"></script>
</body>
</html>
